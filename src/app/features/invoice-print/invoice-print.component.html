<div class="page">

  <!-- Toolbar (screen only) -->
  <div class="no-print toolbar">
    <div>
      <h2>{{ 'invoice.page_title' | translate }}</h2>
      <p class="sub">{{ 'invoice.page_subtitle' | translate }}</p>
    </div>
    <div class="toolbar-actions">
      <button class="btn btn-ghost" (click)="goBack()">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        {{ 'invoice.back' | translate }}
      </button>
      <button class="btn btn-ghost" (click)="print()">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        {{ 'invoice.print' | translate }}
      </button>
      <button class="btn btn-primary" (click)="downloadPDF()">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        {{ 'invoice.download_pdf' | translate }}
      </button>
    </div>
  </div>

  <!-- Loading (invoice or tenant settings still on the way) -->
  <div *ngIf="loading || !settings" class="inv-loading">Loading invoice…</div>

  <!-- ══ Invoice Document — template picked per tenant ══
       1. A bespoke component registered for this tenant_id (TENANT_TEMPLATES) wins.
       2. Otherwise the generic template chosen by tenant config (B2B/B2C or explicit). -->
  <div #invoiceBox *ngIf="!loading && invoice && settings">
    <ng-container *ngIf="customTemplate; else genericTpl">
      <ng-container *ngComponentOutlet="customTemplate; inputs: { invoice: invoice, settings: settings }"></ng-container>
    </ng-container>
    <ng-template #genericTpl>
      <ng-container [ngSwitch]="settings.invoice_template">
        <app-invoice-thermal *ngSwitchCase="'thermal'" [invoice]="invoice" [settings]="settings"></app-invoice-thermal>
        <app-invoice-compact *ngSwitchCase="'compact'" [invoice]="invoice" [settings]="settings"></app-invoice-compact>
        <app-invoice-classic *ngSwitchDefault [invoice]="invoice" [settings]="settings"></app-invoice-classic>
      </ng-container>
    </ng-template>
  </div>

</div>
